# Builds the Journey Ohm APK on GitHub (no local Android SDK needed).
# - Every push to master and every manual run: a debug APK (installable, debug-signed).
# - If the repo secrets below exist: also a release APK signed with YOUR keystore,
#   so it installs over the current phone build. Secrets never appear in logs or the repo.
#     KEYSTORE_BASE64   base64 of the .jks/.keystore file
#     KEYSTORE_PASSWORD keystore password
#     KEY_ALIAS         key alias
#     KEY_PASSWORD      key password (often the same as KEYSTORE_PASSWORD)
# Download the APKs from the run's "Artifacts" section (Actions tab).
name: Build APK
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish the APK to the 'latest-build' release (one fixed phone download link)

jobs:
  apk:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moved to Ubuntu 26 on Oct 19 2026 and the SDK setup action failed there
    timeout-minutes: 30
    env:
      KS: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (preinstalled on the runner; licenses + the platform and build tools this app needs)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"; echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-36" "build-tools;35.0.0" "platform-tools" > /dev/null
      - name: Stamp the build number into the game (dev button + panel header show it)
        run: echo "{\"build\":${{ github.run_number }},\"sha\":\"${GITHUB_SHA::7}\",\"date\":\"$(date -u +%Y-%m-%d)\"}" > www/build.json && cat www/build.json
      - name: Install and sync
        run: |
          npm ci --ignore-scripts
          npx cap sync android
      - name: Node gates (logic only; timing benches skipped on shared runners)
        run: |
          for t in traditions dive gesture systems place_trad haptics drawn_p answers autojam abilities gasfloat senses rare; do
            node tests/${t}_test.mjs | tail -1
          done
      - name: Debug APK
        working-directory: android
        run: |
          chmod +x gradlew   # uploads through the GitHub website drop the executable bit
          ./gradlew --no-daemon assembleDebug -PbuildNum=${{ github.run_number }}
      - name: Signed release APK (only if keystore secrets are set)
        if: ${{ env.KS != '' }}
        env:
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease -PbuildNum=${{ github.run_number }}
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          U=app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -f -p 4 $U app/build/outputs/apk/release/aligned.apk
          $BT/apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KSP --ks-key-alias "$KA" --key-pass env:KP \
            --out app/build/outputs/apk/release/JourneyOhm-release.apk app/build/outputs/apk/release/aligned.apk
          rm -f "$RUNNER_TEMP/release.jks" app/build/outputs/apk/release/aligned.apk
      - name: Name the APKs by version
        run: |
          # ONE file per build, named by build number and date (the same number the game's dev button shows): JourneyOhm-b<N>-<date>.apk
          N=${{ github.run_number }}; D=$(date -u +%Y-%m-%d)
          mkdir out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/JourneyOhm-b$N-$D.apk
          [ -f android/app/build/outputs/apk/release/JourneyOhm-release.apk ] && cp android/app/build/outputs/apk/release/JourneyOhm-release.apk out/JourneyOhm-b$N-$D-release.apk || true
      - name: Publish to the fixed download link (release 'latest-build')
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          gh release delete latest-build -y --cleanup-tag 2>/dev/null || true
          gh release create latest-build out/*.apk --target "$GITHUB_SHA" --title "Build $N ($(date -u +'%Y-%m-%d'), ${GITHUB_SHA::7})" \
            --notes "The newest build only (older builds are removed so there is one file). Tap JourneyOhm-b$N-....apk to download, then open it from Files > Downloads. The game's dev button shows 'dev · b$N' when this build is installed. Installs as an update over build 16 and later (earlier builds: uninstall first)."
      - uses: actions/upload-artifact@v4
        with:
          name: journey-ohm-apk
          path: out/*.apk
