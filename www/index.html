<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Journey Ohm (dev)</title>
<style>
html,body{margin:0;height:100%;background:#05040a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#devtog{position:fixed;top:calc(env(safe-area-inset-top) + 6px);right:8px;z-index:3;background:rgba(40,30,60,.7);color:#cde;border:1px solid #556;border-radius:6px;padding:4px 10px;font-size:13px}
#dev{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 4px);left:4px;right:4px;margin:auto;z-index:2;max-width:min(96vw,430px);max-height:42vh;overflow:auto;background:rgba(10,8,20,.78);color:#cfd6e6;border:1px solid #334;border-radius:8px;padding:6px 8px;font-size:11px;touch-action:pan-y}
#dev pre{margin:2px 0;white-space:pre-wrap;font:10.5px/1.35 ui-monospace,monospace;color:#bfe}
#dev .sec{margin-top:6px;color:#9ab;font-size:11px}
#dev label{display:grid;grid-template-columns:42% 1fr 34px;align-items:center;gap:4px;margin:2px 0}
#dev input[type=range]{width:100%}
#dev i{font-style:normal;text-align:right;color:#dfe}
#dev .row{display:flex;gap:6px;margin:4px 0}
#dev button{background:#2a2440;color:#dde;border:1px solid #556;border-radius:5px;padding:5px 8px;font-size:12px}
#dev details{margin-top:5px;border-top:1px solid #334;padding-top:3px}
#dev summary{color:#9ab;font-size:11px;cursor:pointer}
#dev select,#dev input[type=text],#dev input:not([type]){background:#1a1630;color:#dde;border:1px solid #445;border-radius:4px;font-size:11px;max-width:100%}
#dev .fxrow{border-left:2px solid #445;padding-left:4px;margin:3px 0}
</style></head>
<body><canvas id="c"></canvas><script type="module" src="js/main.js"></script></body></html>
